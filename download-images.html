const T=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc=u=>{let c=~0;for(let i=0;i<u.length;i++)c=T[(c^u[i])&255]^(c>>>8);return(~c)>>>0;};
function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 for(const[f,d]of files){const nm=enc.encode(f),c=crc(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
  parts.push(h.buffer,nm,d);
  const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
  cen.push(e.buffer,nm);off+=30+nm.length+d.length;}
 const cl=cen.reduce((a,b)=>a+b.byteLength,0),z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,cl,true);z.setUint32(16,off,true);
 return new Blob([...parts,...cen,z.buffer],{type:"application/zip"});}
document.getElementById("go").onclick=async()=>{
 const b=document.getElementById("go"),p=document.getElementById("p"),lg=document.getElementById("log");b.disabled=true;p.hidden=false;p.max=L.length;lg.textContent="";
 const files=[],bad=[],errs=[];
 for(let i=0;i<L.length;i++){const[f,t,o]=L[i];let ok=false;
  for(const u of [t,o]){try{const r=await fetch(u);if(!r.ok){errs.push(u.slice(8,40)+" код "+r.status);continue;}files.push([f,new Uint8Array(await r.arrayBuffer())]);ok=true;break;}catch(e){errs.push(u.slice(8,40)+" "+e);}}
  if(!ok)bad.push(f);
  p.value=i+1;lg.textContent="Скачано "+(i+1)+" из "+L.length;}
 if(!files.length){lg.textContent="Ничего не скачалось: браузер не смог достучаться до Wikimedia.\nПричина: "+errs.slice(0,3).join(" | ")+"\nБраузер: "+navigator.userAgent;b.disabled=false;return;}
 const a=document.createElement("a");a.href=URL.createObjectURL(zip(files));a.download="gombrich-images.zip";document.body.appendChild(a);a.click();a.remove();
 lg.textContent="Готово: "+files.length+" файлов в архиве gombrich-images.zip."+(bad.length?"\nНе скачались: "+bad.join(", "):"");b.disabled=false;};
